description: >-
  FinOps view of Tigris object storage spend. Tigris bills usage-based across
  three cost drivers: stored data per GB-month by storage tier (Standard $0.02,
  Infrequent Access $0.01, Archive and Archive Instant Retrieval $0.004), API
  requests split into Class A (PUT/COPY/POST/LIST at $0.005/1k) and Class B
  (GET/SELECT/other at $0.0005/1k), and object-notification events ($0.01/1k).
  There are no egress/bandwidth fees for regional, region-to-region, or internet
  data transfer out, which removes the largest variable cost line that drives
  S3/GCS bills. Infrequent Access and Archive Instant Retrieval add per-GB
  data-retrieval charges and minimum storage-duration commitments (30 / 90 days).
notes: >-
  Per-tier rates are subject to change; verify against the Tigris pricing page
  during reconciliation. The free tier (5 GB Standard storage, 10k Class A, 100k
  Class B per month) offsets baseline cost. DELETE and CANCEL operations are free.
