meters:
- name: standard_storage
  description: Standard-tier data stored, billed per GB-month at $0.02.
  unit: gb_month
  aggregation: sum
  dimensions:
  - account
  - bucket
  - tier
- name: infrequent_access_storage
  description: Infrequent Access-tier data stored, billed per GB-month at $0.01 (30-day minimum).
  unit: gb_month
  aggregation: sum
  dimensions:
  - account
  - bucket
  - tier
- name: archive_storage
  description: Archive and Archive Instant Retrieval data stored, billed per GB-month at $0.004 (90-day minimum).
  unit: gb_month
  aggregation: sum
  dimensions:
  - account
  - bucket
  - tier
- name: class_a_requests
  description: Class A requests (PUT, COPY, POST, LIST) billed per 1,000 at $0.005.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - bucket
  - operation
- name: class_b_requests
  description: Class B requests (GET, SELECT, and most others) billed per 1,000 at $0.0005.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - bucket
  - operation
- name: data_retrieval
  description: Per-GB retrieval for Infrequent Access ($0.01/GB) and Archive Instant Retrieval ($0.03/GB); Standard and Archive retrieval are free.
  unit: gb
  aggregation: sum
  dimensions:
  - account
  - bucket
  - tier
- name: egress
  description: Data transfer out. Tigris charges no egress fees - this meter is informational only and always $0.
  unit: gb
  aggregation: sum
  dimensions:
  - account
  - bucket
- name: object_notifications
  description: Object-notification events billed per 1,000 at $0.01.
  unit: events
  aggregation: sum
  dimensions:
  - account
  - bucket
principles:
- name: Visibility
  description: Pull Tigris usage and billing exports; break spend down by bucket, tier, and request class.
- name: Allocation
  description: Tag/segment access keys and buckets per workload/team; map to internal cost centers.
- name: Optimization
  description: Tier cold data to Infrequent Access or Archive; consolidate small objects to cut Class A request volume; rely on zero-egress to read globally without bandwidth penalties; mind 30/90-day minimum durations before early deletion.
- name: Accountability
  description: Assign owners per bucket/project; review storage growth and request-class burn monthly against budget.
